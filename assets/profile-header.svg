<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">Yatish Chaubal. Full-stack developer, backend-focused.</title>
  <desc id="desc">Software Developer at Schach Engineers. A request travels from the interface (React and Next.js) through services (Go, Gin, Encore) to data (PostgreSQL with GORM v2) and back.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
    .packet { animation: travel 6s ease-in-out infinite; }
    .s1 { animation: pass1 6s ease-in-out infinite; }
    .s2 { animation: pass2 6s ease-in-out infinite; }
    .s3 { animation: pass3 6s ease-in-out infinite; }
    @keyframes travel { 0%, 100% { transform: translateY(0); } 25%, 75% { transform: translateY(75px); } 50% { transform: translateY(150px); } }
    @keyframes pass1 { 0%, 100% { opacity: 1; } 14%, 86% { opacity: 0.6; } }
    @keyframes pass2 { 0%, 11%, 39%, 61%, 89%, 100% { opacity: 0.6; } 25%, 75% { opacity: 1; } }
    @keyframes pass3 { 0%, 36%, 64%, 100% { opacity: 0.6; } 50% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .packet, .s1, .s2, .s3 { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F1922"/>
      <stop offset="1" stop-color="#080D13"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.86" cy="0.1" r="0.8">
      <stop stop-color="#27444B" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#080D13" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="halo">
      <stop stop-color="#FF9659" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#FF9659" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0.75" y="0.75" width="1198.5" height="328.5" rx="22"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="330" fill="url(#bg)"/>
    <rect width="1200" height="330" fill="url(#haze)"/>
    <path d="M752 0V330" stroke="#A8CEDC" stroke-opacity="0.08"/>

    <!-- Identity -->
    <text x="58" y="118" font-size="70" font-weight="700" letter-spacing="-2.8" fill="#F2F6F8">Yatish Chaubal</text>
    <text x="62" y="162" font-size="24" letter-spacing="-0.2" fill="#B9C7D3">Full-stack developer, backend-focused.</text>
    <text x="62" y="246" font-size="15" fill="#8699AB">Software Developer at</text>
    <text x="62" y="278" font-size="26" font-weight="600" letter-spacing="-0.5" fill="#F2F6F8">Schach Engineers</text>

    <!-- Request path: interface, services, data -->
    <path d="M806 92V242" stroke="#34505E" stroke-width="1.5"/>
    <path d="M840 146H1140M840 221H1140" stroke="#A8CEDC" stroke-opacity="0.08"/>

    <g class="s1">
      <text x="840" y="97" font-size="14" fill="#8FA6B7">Interface</text>
      <text x="840" y="128" font-size="24" font-weight="500" letter-spacing="-0.5" fill="#F2F6F8">React and Next.js</text>
    </g>
    <g class="s2">
      <text x="840" y="172" font-size="14" fill="#8FA6B7">Services</text>
      <text x="840" y="203" font-size="24" font-weight="500" letter-spacing="-0.5" fill="#F2F6F8">Go, Gin, Encore</text>
    </g>
    <g class="s3">
      <text x="840" y="247" font-size="14" fill="#8FA6B7">Data</text>
      <text x="840" y="278" font-size="24" font-weight="500" letter-spacing="-0.5" fill="#F2F6F8">PostgreSQL with GORM v2</text>
    </g>

    <g fill="#0B131A" stroke="#5E8794" stroke-width="1.5">
      <circle cx="806" cy="92" r="4.5"/>
      <circle cx="806" cy="167" r="4.5"/>
      <circle cx="806" cy="242" r="4.5"/>
    </g>

    <g class="packet">
      <circle cx="806" cy="92" r="15" fill="url(#halo)"/>
      <circle cx="806" cy="92" r="3.6" fill="#FFB48A"/>
    </g>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="328.5" rx="22" fill="none" stroke="#24313D" stroke-width="1.5"/>
</svg>
