<svg xmlns="http://www.w3.org/2000/svg" width="600" height="240" viewBox="0 0 600 240" role="img" aria-labelledby="title">
  <title id="title">HireNest architecture sketch: a Next.js client calling resume, guidance, and subscription services, connected by Kafka to Redis and PostgreSQL.</title>
  <style>
    text { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; font-size: 13px; fill: #C9D6E2; text-anchor: middle; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F1922"/>
      <stop offset="1" stop-color="#080D13"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.7" cy="0.5" r="0.6">
      <stop stop-color="#27444B" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#080D13" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0.75" y="0.75" width="598.5" height="238.5" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="600" height="240" fill="url(#bg)"/>
    <rect width="600" height="240" fill="url(#haze)"/>

    <!-- Connections -->
    <g fill="none" stroke="#3A5766" stroke-width="1.4">
      <path d="M132 116C164 116 160 58 192 58"/>
      <path d="M132 116H192"/>
      <path d="M132 116C164 116 160 174 192 174"/>
      <path d="M344 58H392M344 116H392M344 174H392"/>
      <path d="M402 81H464M402 151H464"/>
    </g>

    <!-- Client and services -->
    <g fill="#131D28" stroke="#2B3D4A">
      <rect x="32" y="99" width="100" height="34" rx="8"/>
      <rect x="192" y="41" width="152" height="34" rx="8"/>
      <rect x="192" y="99" width="152" height="34" rx="8"/>
      <rect x="192" y="157" width="152" height="34" rx="8"/>
      <rect x="464" y="64" width="104" height="34" rx="8"/>
      <rect x="464" y="134" width="104" height="34" rx="8"/>
    </g>
    <text x="82" y="120.5">next.js</text>
    <text x="268" y="62.5">resume-ai</text>
    <text x="268" y="120.5">guidance</text>
    <text x="268" y="178.5">subscriptions</text>
    <text x="516" y="85.5">redis</text>
    <text x="516" y="155.5">postgres</text>

    <!-- Event bus -->
    <rect x="392" y="40" width="10" height="152" rx="5" fill="#FF9659"/>
    <text x="397" y="216" style="fill:#FFB48A">kafka</text>
  </g>
  <rect x="0.75" y="0.75" width="598.5" height="238.5" rx="14" fill="none" stroke="#24313D" stroke-width="1.5"/>
</svg>
