    <rect width="1200" height="150" fill="url(#haze)"/>
    <text x="60" y="86" font-size="32" font-weight="600" letter-spacing="-0.8" fill="#F2F6F8">Let's talk about what you're building.</text>
    <rect x="846" y="48" width="292" height="54" rx="27" fill="#16202B" stroke="#FF9659" stroke-opacity="0.75" stroke-width="1.5"/>
    <text x="992" y="81" font-size="17" font-weight="600" text-anchor="middle" fill="#F2F6F8">chaubaly@gmail.com</text>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="148.5" rx="22" fill="none" stroke="#24313D" stroke-width="1.5"/>
