<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title">
  <title id="title">Let's talk about what you're building. Email chaubaly@gmail.com</title>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F1922"/>
      <stop offset="1" stop-color="#080D13"/>
    </linearGradient>
    <radialGradient id="haze" cx="0.86" cy="0.5" r="0.6">
      <stop stop-color="#27444B" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#080D13" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="frame"><rect x="0.75" y="0.75" width="1198.5" height="148.5" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#frame)">
